services:
  # Unified Agentic AI Studio: Gateway, MCP Server, Agent Chatbot & Evals UI
  agentic-ai:
    build:
      context: .
      dockerfile: llm-gateway/Dockerfile
    container_name: agentic_ai_studio
    ports:
      - "8000:8000"
    environment:
      - LLM_GATEWAY_HOST=0.0.0.0
      - LLM_GATEWAY_PORT=8000
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      - DEFAULT_MODEL=ollama/qwen2.5-coder:7b
      - LLM_GATEWAY_DB_PATH=/app/data/llm_gateway.db
      - LLM_GATEWAY_JSON_LOG_PATH=/app/data/gateway_audit.jsonl
    volumes:
      - gateway-data:/app/data
      - ./workspace:/app/workspace
      - ./evals-framework/reports:/app/evals-framework/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  gateway-data:
    driver: local
